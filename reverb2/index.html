<html lang="en">
<head>

<style>
/* Reverb Desk (Team Hub, preview): Reverb messages, offers and refund requests in one place.
   Reverb is read live through the hub (/rv/); who has it, status and manager OK live in Airtable "Reverb Desk". */
:root{
  --bg:#F5EFE4; --surface:#FFFBF4; --sunk:#FAF4EA; --ink:#2B211A; --muted:#7A6A5C; --line:#E6DCCB; --line2:#CDBFA8;
  --accent:#7A2E1F; --accent-ink:#FFF7EE; --accent-soft:#F3E2D9; --accent-text:#7A2E1F;
  --ok:#2F6B3A; --ok-soft:#E3EDD9; --warn:#9E2A1E; --warn-soft:#F6DED7; --info:#3D4C8A; --info-soft:#E2E5F1; --sugg:#9A5B13; --sugg-soft:#F4E3C8;
  --font:"Work Sans","Segoe UI",system-ui,sans-serif; --display:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#3A3029; --surface:#463A31; --sunk:#40352D; --ink:#F6EDE0; --muted:#CBB9A5; --line:#5A4B3F; --line2:#766556;
  --accent:#C0533A; --accent-ink:#FFF7EE; --accent-soft:#5A3A2E; --accent-text:#F4AE96;
  --ok:#A6DB9E; --ok-soft:#33452F; --warn:#FFA592; --warn-soft:#5A2E25; --info:#C1C9FA; --info-soft:#3B4060; --sugg:#F2C27A; --sugg-soft:#55402A; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar h1{margin:0;font-size:20px;font-weight:600}
.bar h1 small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-left:8px;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:1px 6px;vertical-align:3px}
.bar select{font-size:14px;border-radius:6px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:inherit;padding:5px 8px}
.bar select option{color:#2B211A}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wrap{max-width:1400px;margin:0 auto;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{font-size:12px;opacity:.8;margin-left:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}
  /* phones: list OR the open item, not both stacked */
  body:not(.mdet) #detail,body:not(.mdet) #mback{display:none}
  body.mdet .cols>div:first-child{display:none}
  #mback{display:block;margin:0 0 8px}}
@media (min-width:901px){#mback{display:none}}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.item:hover{border-color:var(--line2)}
.item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .it{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.hot{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.sugg{background:var(--sugg-soft);color:var(--sugg);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin:0 0 4px;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:14px 0;max-height:52vh;overflow:auto;padding-right:4px}
.msg{max-width:85%;border-radius:10px;padding:8px 12px;background:var(--sunk);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg .w{font-size:12px;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.t{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:15px;width:100%;min-width:0;color:var(--ink)}
textarea.t{min-height:80px;resize:vertical}
.btn{border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:38px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn:disabled{background:var(--sunk);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.note{border-radius:8px;padding:9px 12px;font-size:14px;background:var(--info-soft);color:var(--info);margin:8px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:10px 0}
.kv b{color:var(--muted);font-weight:600}
.sect{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.more{margin-top:8px}
.empty{color:var(--muted);padding:20px;text-align:center}
table.ht{width:100%;border-collapse:collapse;font-size:13.5px}
table.ht th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line2);padding:5px 8px;white-space:nowrap}
table.ht td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.ht tr.cur td{background:var(--accent-soft)}

.mback{position:fixed;inset:0;background:rgba(30,20,12,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:10px;max-width:520px;width:100%;padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-size:18px}
.tpanel{max-width:760px}
.tgrp{margin:14px 0 6px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.titem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--sunk)}
.mgr{max-width:900px}.gap{border-left:4px solid var(--warn);padding:6px 10px;margin:6px 0;background:var(--sunk);border-radius:6px}.gap.ok{border-left-color:var(--ok)}.gap .small{margin-top:2px}.askout{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;max-height:45vh;overflow:auto}
@media (max-width:900px){ body.tasksTab:not(.mdet) #detail{display:block} body.tasksTab:not(.mdet) .cols>div:first-child{display:block} }
.mphotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mphotos img{width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.titem.done{opacity:.55}.titem .tt{font-weight:600}.titem input{margin-top:3px;width:18px;height:18px;flex:none}
</style>

<body>
<header class="bar"><div class="in"><h1>Reverb Desk</h1>
  <div class="row"><select id="who" aria-label="Who's working"><option value="">Who's working?</option></select><a href="../">Hub</a></div></div></header>
<main class="wrap">
  <div class="note" id="banner" hidden></div>
  <div class="tabs tabs-calm" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="cols">
    <div><div class="list" id="list"><div class="empty">Loading…</div></div><div class="more" id="more"></div></div>
    <div><button class="btn sec" id="mback" type="button">← Back to list</button><div id="detail" class="card"><div class="muted">Pick something on the left.</div></div></div>
  </div>
</main>
<script>
"use strict";
const BASE="appZD2jJGbSlvofcV", DESK="tblNByB9aK4puxKFb", PL="tbleYgUhKCIepPtFR";
const DF={title:"fldubrj1IcLaHQXBg",kind:"fldZuZSoY93Kmc1lX",rid:"fldnFibA16LGVMiUb",buyer:"fldUBADwX1RjHUcVD",listing:"fldfwFchAUggByudP",status:"fldhuIlW95NqgANw0",to:"fldn65XAPP9sf8kOz",by:"fldv35IO74arRPOjc",needs:"fldHrKUHh3JrdYRQb",okBy:"fld1KLfYCjgWkFA0D",notes:"fldAdcTvhCOJaMvFD",lastBy:"fldtDszwTfUo6gDIW",last:"fldjkHo5cvNmIhT7v",lid:"fldj5Dl4XWNvv2vwr",sku:"fld4nknkxxMe4bTBZ",offer:"fldhzYYWNYXEp1QNy",resp:"fldWvPbCMSEnXm79Y",counter:"fldlu7xPqr9y4KSM7",result:"fld5Podo2PfhkNBz6"};
const STAFF=(function(){ var fb=["Jon","Sam","Nina","Julia","Ethan","Kyle","Andy","Jeff","Chris","Sturgis","Mike"]; try{ var c=JSON.parse(localStorage.getItem("mrm-staff")||"null"); if(Array.isArray(c)&&c.length) return c; }catch(e){} return fb; })();
(function(){ try{ fetch("https://api.airtable.com/v0/appZD2jJGbSlvofcV/tbluogAt5hDWgzbgi?filterByFormula="+encodeURIComponent("{In Apps}")+"&fields%5B%5D=Name&fields%5B%5D=Can%20Approve&fields%5B%5D=Departments",{headers:{Authorization:"Bearer via-hub"}}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(!j||!j.records||!j.records.length) return; var rs=j.records.filter(function(r){return r.fields&&r.fields.Name;}); if(!rs.length) return; var n=rs.map(function(r){return r.fields.Name;}); var ap=rs.filter(function(r){return r.fields["Can Approve"];}).map(function(r){return r.fields.Name;}); var ids={}; rs.forEach(function(r){ids[r.fields.Name]=r.id;}); var depts={}; rs.forEach(function(r){depts[r.fields.Name]=r.fields.Departments||[];});
  try{ localStorage.setItem("mrm-staff",JSON.stringify(n)); localStorage.setItem("mrm-approvers",JSON.stringify(ap)); localStorage.setItem("mrm-staff-ids",JSON.stringify(ids)); localStorage.setItem("mrm-staff-depts",JSON.stringify(depts)); }catch(e){}
  var changed=n.join("|")!==STAFF.join("|"); STAFF.splice.apply(STAFF,[0,STAFF.length].concat(n)); window.STAFF_IDS=ids; window.STAFF_DEPTS=depts; if(changed&&typeof window.onStaff==="function") window.onStaff(); }).catch(function(){}); }catch(e){} })();
const MANAGERS=(function(){ try{ var c=JSON.parse(localStorage.getItem("mrm-approvers")||"null"); if(Array.isArray(c)&&c.length) return c; }catch(e){} return ["Jon","Sam","Nina"]; })();
var DRAFTS_R={};
const MGR_OK=false; // manager approval switched off for now (Jon, 11/7)
const OLD_CUTOFF=Date.parse("2026-10-31T16:00:00Z"); // 11/7: Jon cleared everything older than a week; anything after this is tracked
const STATUSES=["New","Assigned",...(MGR_OK?["Waiting on manager"]:[]),"Answered","Done"];
const KINDS={msg:"Message",offer:"Offer",refund:"Refund request",order:"Order"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let WHO=store.get("mrm-photos-who"), TAB="tasks", FILTER="tall", SEL=null;
const S={msg:{rows:[],page:0,pages:1},offer:{rows:[]},refund:{rows:[]},order:{rows:[],page:0,pages:1}};
let DESKROWS={}; // key kind:id -> airtable record
const ago=d=>{ if(!d) return ""; const s=(Date.now()-new Date(d))/1000; if(s<3600) return Math.max(1,Math.round(s/60))+"m ago"; if(s<86400) return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; };
const when=d=>d?new Date(d).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";

/* ---------- data ---------- */
async function rv(path,opt){ const r=await fetch("/rv/"+path.replace(/^https?:\/\/[^/]+\/api\//,""),opt); const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch(e){} if(!r.ok){ throw new Error(r.status===423?"Sending to Reverb is switched off during the preview.":(j.message||j.error||t.slice(0,140)||("Reverb said "+r.status))); } return j; }
async function at(path,opt){ const r=await fetch(`https://api.airtable.com/v0/${BASE}/${path}`,{...opt,headers:{"Content-Type":"application/json"}}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&(j.error.message||j.error.type))||("Airtable "+r.status)); return j; }
async function loadDesk(){ DESKROWS={}; let off=""; do{ const j=await at(`${DESK}?pageSize=100&returnFieldsByFieldId=true${off?"&offset="+off:""}`); (j.records||[]).forEach(r=>{ const f=r.fields, k=(Object.entries(KINDS).find(([a,b])=>b===(f[DF.kind]&&f[DF.kind].name||f[DF.kind]))||["msg"])[0]+":"+f[DF.rid]; DESKROWS[k]=r; }); off=j.offset||""; }while(off); }
const dv=(r,k)=>{ const v=r&&r.fields&&r.fields[DF[k]]; return v&&typeof v==="object"&&!Array.isArray(v)?v.name:v; };
async function loadMsgs(more){ const st=S.msg; if(!more){ st.rows=[]; st.page=0; } if(st.page>=st.pages&&more) return; const j=await rv(`my/conversations?per_page=50&page=${st.page+1}`); st.page=j.current_page||st.page+1; st.pages=j.total_pages||1; st.total=j.total;
  (j.conversations||[]).forEach(c=>{ const id=(c._links.self.href.match(/conversations\/(\d+)/)||[])[1]; st.rows.push({kind:"msg",id,title:c.other_party&&c.other_party.name||"Buyer",sub:(c.listing&&c.listing.title)||"",last:c.last_message,read:c.read,replied:c.replied,at:c.last_message&&c.last_message.created_at,raw:c}); }); }
async function loadOffers(){ const st=S.offer; st.rows=[]; let p=1,pages=1; do{ const j=await rv(`my/listings/negotiations?per_page=50&page=${p}`); pages=j.total_pages||1; (j.listings||[]).forEach(L=>(L.negotiations||[]).forEach(n=>st.rows.push({kind:"offer",id:String(n.id),title:L.title,sub:(n.buyer_name||n.other_party_name||"Buyer")+(n.you_last_initiated?" · waiting on them":" · offered "+(n.last_offered_price&&n.last_offered_price.display&&n.last_offered_price.display.display||"")),at:n.updated_at||n.created_at,n,L}))); p++; }while(p<=pages&&p<6); }
function offerAmt(n){ const x=n&&n.last_offered_price; return x&&x.original&&+x.original.amount||x&&x.display&&+String(x.display.display||"").replace(/[^0-9.]/g,"")||0; }
async function syncOffers(){ // keep our own offer history: Reverb only reports open offers
  const now=new Set(S.offer.rows.map(r=>r.id)), creates=[], patches=[];
  S.offer.rows.forEach(r=>{ const d=deskOf(r), amt=offerAmt(r.n);
    if(!d) creates.push({fields:{[DF.title]:r.L.title+" — "+(r.n.buyer_name||""),[DF.kind]:"Offer",[DF.rid]:r.id,[DF.buyer]:r.n.buyer_name||"",[DF.listing]:r.L.title,[DF.lid]:String(r.L.id),[DF.sku]:r.L.sku||"",[DF.offer]:amt||null,[DF.status]:r.n.actionable?"New":"Answered",...(r.n.you_last_initiated&&r.n.offers_count>1?{[DF.resp]:"Countered"}:{}),[DF.result]:"Open",[DF.last]:r.at||null}});
    else { const fx={}; if(amt&&+dv(d,"offer")!==amt){ fx[DF.offer]=amt; fx[DF.last]=r.at||null; }
      if(!r.n.actionable&&dv(d,"status")==="New") fx[DF.status]="Answered";
      if(r.n.actionable&&(dv(d,"status")==="Answered"||dv(d,"status")==="Done")) fx[DF.status]="New"; // buyer answered back
      if(Object.keys(fx).length) patches.push({id:d.id,fields:fx}); } });
  Object.entries(DESKROWS).forEach(([k,d])=>{ if(!k.startsWith("offer:")) return; const id=k.slice(6); if(now.has(id)) return; const res=dv(d,"result");
    if(!res||res==="Open") patches.push({id:d.id,fields:{[DF.result]:dv(d,"resp")==="Accepted"?"Sold":"Expired / closed",...(dv(d,"resp")?{}:{[DF.resp]:"No response"}),...(dv(d,"status")==="Done"?{}:{[DF.status]:"Done"})}}); });
  for(let i=0;i<creates.length;i+=10){ const j=await at(`${DESK}?returnFieldsByFieldId=true`,{method:"POST",body:JSON.stringify({records:creates.slice(i,i+10),typecast:true,returnFieldsByFieldId:true})}); (j.records||[]).forEach(r=>{ DESKROWS["offer:"+r.fields[DF.rid]]=r; }); }
  for(let i=0;i<patches.length;i+=10){ const j=await at(`${DESK}?returnFieldsByFieldId=true`,{method:"PATCH",body:JSON.stringify({records:patches.slice(i,i+10),typecast:true,returnFieldsByFieldId:true})}); (j.records||[]).forEach(r=>{ DESKROWS["offer:"+r.fields[DF.rid]]=r; }); } }
function historyTable(row){ const L=row.L, rows=Object.entries(DESKROWS).filter(([k,d])=>k.startsWith("offer:")&&(String(dv(d,"lid")||"")===String(L.id)||(!dv(d,"lid")&&dv(d,"listing")===L.title))).map(([k,d])=>d)
    .sort((a,b)=>String(dv(b,"last")||b.createdTime||"").localeCompare(String(dv(a,"last")||a.createdTime||"")));
  if(!rows.length) return "";
  const m=v=>v||v===0?"$"+Number(v).toLocaleString("en-US"):"–";
  return `<h3 style="margin:12px 0 6px;font-size:15px">All offers on this listing <span class="small muted" style="font-weight:500">(${rows.length})</span></h3>
  <div style="overflow-x:auto"><table class="ht"><thead><tr><th>Date</th><th>Buyer</th><th>Offer</th><th>Our response</th><th>Result</th><th>Handled by</th><th>Assigned</th></tr></thead><tbody>
  ${rows.map(d=>{ const cur=String(dv(d,"rid"))===String(row.id); const resp=dv(d,"resp")||(cur?(row.n.you_last_initiated?(row.n.offers_count<=1?"Our offer to watcher":"Waiting on buyer"):"Waiting on us"):"–"); return `<tr class="${cur?"cur":""}"><td>${esc(dv(d,"last")?new Date(dv(d,"last")).toLocaleDateString([], {month:"short",day:"numeric",year:"2-digit"}):"–")}</td><td>${esc(dv(d,"buyer")||"")}${cur?' <span class="tag info">this one</span>':""}</td><td>${m(dv(d,"offer"))}</td><td>${esc(resp)}${dv(d,"counter")?" at "+m(dv(d,"counter")):""}</td><td>${esc(dv(d,"result")||"Open")}</td><td>${esc((dv(d,"lastBy")||"–").replace(" (no reply needed)",""))}</td><td>${esc(dv(d,"to")||"–")}</td></tr>`; }).join("")}
  </tbody></table></div><div class="small muted">History starts 11/7/2026. Reverb only reports open offers, so the hub keeps its own record from here on.</div>`; }
function stageOf(o){ const st=o.status, sh=o.shipment_status;
  if(st==="unpaid"||st==="pending_review"||st==="payment_pending") return "Waiting for payment";
  if(st==="paid"||st==="partially_paid") return o.local_pickup?"Paid · local pickup":"Paid · needs shipping";
  if(st==="shipped"){ if(sh==="delivered") return "Delivered"; if(sh==="out_for_delivery") return "Out for delivery"; return "Shipped · in transit"; }
  if(st==="received") return "Received"; if(st==="picked_up") return "Picked up"; if(st==="refunded") return "Refunded"; if(st==="cancelled") return "Cancelled";

   order:r.kind==="order"?{number:r.o.order_number,total:r.o.total&&r.o.total.display,paid:r.o.paid_at||"",sku:r.o.sku}:undefined,
   last:r.kind==="msg"&&r.last?{fromUs:!!r.last.authored,text:String(r.last.body||"").slice(0,200)}:undefined}; };
  const open=[...S.msg.rows.filter(r=>statusOf(r)!=="Done"),...S.offer.rows,...S.refund.rows,...S.order.rows.filter(r=>!/Delivered|Received|Picked|Refunded|Cancelled/.test(r.stage))];
  return {now:new Date().toString(),you:WHO,staff:STAFF,managers:MANAGERS,items:open.slice(0,200).map(L),tasks:(TASKS||[]).filter(r=>tv(r,"status")!=="Done").map(r=>({task:tv(r,"task"),to:tv(r,"to")||"",dept:tv(r,"dept"),due:tv(r,"due")||"",status:tv(r,"status"),source:tv(r,"source")||""}))}; }
var ASK=[]; var ASKBUSY=false;
function md(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>"); }
async function openMgr(){ closeModal(); try{ if(!TASKS) await loadTasks(); }catch(e){}
  const el=document.createElement("div"); el.className="mback"; el.id="tmodal";
  const g=gaps();
  el.innerHTML=`<div class="mbox mgr"><div class="row" style="justify-content:space-between"><h3>Manager view</h3><button class="btn sec sm" id="tClose" type="button">Close</button></div>
   <div class="small muted" style="margin-bottom:8px">Everything open on Reverb right now, what's happening, and a box to ask about it.</div>
   ${g.length?g.map((x,gi)=>`<div class="gap ${x.sev>1?"ok":""}"><b>${esc(x.title)}</b> <span class="small muted">${x.items.length}</span>${x.hint?` <span class="small muted">· ${esc(x.hint)}</span>`:""}
      <div class="small">${x.items.slice(0,8).map((it,ii)=>`<div>• ${it.r?`<a href="#" data-gopen="${it.r.kind}|${esc(it.r.id)}">${esc(it.t)}</a>`:esc(it.t)}${it.x?` <span class="muted">(${esc(it.x)})</span>`:""}${it.r?` <button class="chip" style="padding:0 6px;font-size:11px" data-gtask="${it.r.kind}|${esc(it.r.id)}" type="button">+ task</button>`:""}</div>`).join("")}${x.items.length>8?`<div class="muted">…and ${x.items.length-8} more</div>`:""}</div></div>`).join(""):`<div class="gap ok">Nothing needs attention right now.</div>`}
   <h3 style="margin-top:14px;font-size:16px">Ask</h3>
   <div id="askOut">${ASK.filter(m=>m.role==="assistant").length?`<div class="askout">${md(ASK[ASK.length-1].content.replace(/TASKS_JSON:[\s\S]*$/,""))}</div>`:""}</div>
   <div class="row"><input class="t" id="askIn" placeholder="e.g. What's happening? Who has the most open? Give the Martin offers to Sam." style="flex:1;min-width:0"><button class="btn" id="askGo" type="button">Ask</button></div>
   <div id="askAct"></div></div>`;
  document.body.appendChild(el); setTimeout(()=>{ try{ $("askIn").focus(); }catch(e){} },50); }
async function askGo(){ if(ASKBUSY) return; const q=$("askIn").value.trim(); if(!q) return; ASKBUSY=true; $("askGo").disabled=true; $("askOut").innerHTML=`<div class="askout muted">Thinking…</div>`; $("askAct").innerHTML="";
  const sys=`You are the Reverb manager's assistant at Mill River Music, a used and new music gear shop in Northampton, MA that sells on Reverb. You see a live snapshot of everything open in the shop's Reverb Desk (messages, offers, refund requests, orders) plus the team's task list. Answer the manager briefly and plainly, like a sharp coworker: short sentences, lists only when listing items. Point out anything slipping (unanswered messages, offers waiting on us or about to expire, unshipped paid orders, items needing a manager's OK, overdue or unclaimed tasks). Never invent items that aren't in the snapshot. You cannot send anything to buyers. If the manager asks you to assign or create tasks, include at the very end a line "TASKS_JSON:" followed by a JSON array of {"task","to","due","details","source"} where "to" is a staff first name from the list or "" for the Reverb department, and "due" is YYYY-MM-DD. Only include TASKS_JSON when tasks were asked for.
SNAPSHOT:
${JSON.stringify(snapshot())}`;
  ASK.push({role:"user",content:q}); $("askIn").value="";
  try{ const r=await fetch("/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys,max_tokens:4000,messages:ASK.slice(-10)})}); const j=await r.json();
    if(!r.ok) throw new Error((j.error&&j.error.message)||j.message||("Error "+r.status));
    let text=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n").trim(); ASK.push({role:"assistant",content:text});
    let tasks=[]; const m=text.match(/TASKS_JSON:\s*(\[[\s\S]*\])\s*$/); if(m){ try{ tasks=JSON.parse(m[1]); }catch(e){} text=text.slice(0,m.index).trim(); }
    $("askOut").innerHTML=`<div class="askout">${md(text)}</div>`+(j.stop_reason==="max_tokens"?`<div class="small muted">That answer got cut off. Ask it to keep it shorter.</div>`:"");
    if(tasks.length){ window.__pendingTasks=tasks; $("askAct").innerHTML=`<div class="note"><b>Make these tasks?</b>${tasks.map(t=>`<div class="small">• ${esc(t.task)} → ${esc(t.to||"Reverb dept")}${t.due?" · due "+esc(t.due):""}</div>`).join("")}<div class="row" style="margin-top:6px"><button class="btn sm" id="askMake" type="button">Add them</button><button class="btn sec sm" id="askNo" type="button">Not now</button></div></div>`; }
  }catch(err){ ASK.pop(); $("askOut").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; }
  ASKBUSY=false; const b=$("askGo"); if(b) b.disabled=false; }
async function makeAskTasks(){ const ts=window.__pendingTasks||[]; if(!WHO){ flashTop("Pick your name at the top first."); return; }
  const recs=ts.map(t=>{ const needsOk=false; const f={[TF.task]:t.task,[TF.dept]:"Reverb",[TF.status]:needsOk?"Needs OK":"To do",[TF.details]:t.details||"",[TF.source]:t.source||"Manager view",[TF.madeBy]:WHO}; if(t.to&&STAFF.includes(t.to)) f[TF.to]=t.to; if(/^\d{4}-\d\d-\d\d$/.test(t.due||"")) f[TF.due]=t.due; return {fields:f}; });
  for(let i=0;i<recs.length;i+=10) await at(`${TT}`,{method:"POST",body:JSON.stringify({records:recs.slice(i,i+10),typecast:true})});
  TASKS=null; updTaskBtn(); $("askAct").innerHTML=`<div class="note ok">Added ${recs.length} task${recs.length===1?"":"s"}.</div>`; }
document.addEventListener("click",async e=>{ const t=e.target;
  if(t.id==="mgrBtn"){ openMgr(); return; }
  if(t.id==="askGo"){ askGo(); return; }
  if(t.id==="askMake"){ t.disabled=true; try{ await makeAskTasks(); }catch(err){ flashTop(err.message); t.disabled=false; } return; }
  if(t.id==="askNo"){ $("askAct").innerHTML=""; return; }
  if(t.dataset&&t.dataset.gopen){ e.preventDefault(); const [k,id]=t.dataset.gopen.split("|"); closeModal(); await openRow(k,id); return; }
  if(t.dataset&&t.dataset.gtask){ const [k,id]=t.dataset.gtask.split("|"); const row=S[k].rows.find(r=>r.id===id); if(row) taskPrompt(Object.assign(taskCtx(row,k==="offer"?"offer":k==="order"?"order":"reply"),{ask:false})); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="askIn"){ e.preventDefault(); askGo(); } });


</script>
