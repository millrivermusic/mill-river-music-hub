<head>

<style>
/* MRM Lookup: find any item, see where it stands, check prices. View-only until you choose to make a change, and every change is confirmed first. */
:root{
  --bg:#F2EFEA; --surface:#FFFFFF; --sunk:#F8F6F2; --ink:#1E1B16; --muted:#6B6358; --line:#E2DCD2;
  --accent:#8A3B12; --accent-ink:#FFFFFF; --accent-soft:#F6E4D8;
  --ok:#1D7A4E; --ok-soft:#DDF2E6; --warn:#B4361F; --warn-soft:#FBE3DD; --info:#3F51B5; --info-soft:#E4E7FA; --sugg:#9A6A00; --sugg-soft:#FBEFCF;
  --font:"Atkinson Hyperlegible","Roboto","Segoe UI",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13110E; --surface:#1C1915; --sunk:#171511; --ink:#EEE8DF; --muted:#A39A8C; --line:#2F2A23;
  --accent:#F09A5E; --accent-ink:#1A0D04; --accent-soft:#3A2414;
  --ok:#4FC68D; --ok-soft:#163626; --warn:#FF7A5E; --warn-soft:#3A1B14; --info:#9AA6FF; --info-soft:#22264A; --sugg:#F0C14D; --sugg-soft:#3A2E10; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar h1{margin:0;font-size:20px;font-weight:800}
.bar a{color:inherit;font-size:14px;font-weight:700;text-decoration:none;opacity:.9}
.bar select{font:inherit;font-size:14px;border-radius:9px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:inherit;padding:5px 8px}
.bar select option{color:#1E1B16}
.wrap{max-width:960px;margin:0 auto;padding-top:14px;padding-bottom:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 8px;font-size:18px;font-weight:800}
.card h3{margin:0 0 6px;font-size:15px;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px;cursor:pointer}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.warnb{background:var(--warn);color:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.t,select.t,textarea.t{border:1px solid var(--line);background:var(--sunk);border-radius:11px;padding:10px 12px;font-size:16px;min-width:0;width:100%}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.t{min-height:64px;resize:vertical}
.muted{color:var(--muted)} .small{font-size:13.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{opacity:.85;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res b{line-height:1.25}
.res .meta{grid-column:1/-1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .why{grid-column:1/-1;font-size:13px;color:var(--warn);font-weight:700}
.price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sku{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.skubig{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.02em}
.seg{display:inline-flex;width:max-content;max-width:100%;justify-self:start;align-self:flex-start;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:var(--sunk);padding:9px 18px;font-weight:700;cursor:pointer;color:var(--muted);min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.dates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.dates input[type=date]{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink);font:inherit}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin-top:12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sunk);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .tag.need{background:var(--sugg-soft);color:var(--sugg);border-color:transparent} .tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent} .tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.prices div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.prices dt{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.prices dd{margin:2px 0 0;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.prices dd.none{color:var(--muted);font-weight:600}
@media (max-width:420px){.prices{grid-template-columns:repeat(2,minmax(0,1fr))}}
.deets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 14px;margin:12px 0 0}
.deets div{min-width:0} .deets dt{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase} .deets dd{margin:0;overflow-wrap:anywhere}
.notebox{margin-top:12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.notebox b{display:block;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;white-space:normal}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:12px}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;background:var(--sunk)}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.linkrow a{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:inherit;text-decoration:none}
.linkrow a:hover{border-color:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.hist th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
table.hist td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.hist td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollx{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;min-width:0}
label.f.wide{grid-column:1/-1}
.locked{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px}
.review{margin-top:12px;border:2px solid var(--warn);border-radius:14px;padding:14px;background:var(--warn-soft)}
.review p{margin:0 0 8px;font-weight:800;color:var(--warn)}
.review ul{margin:0 0 10px;padding-left:20px}
.note{border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:10px;background:var(--info-soft);color:var(--info);font-weight:700}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.ok{background:var(--ok-soft);color:var(--ok)}
.scan{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan .frame{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan .foot{position:absolute;left:0;right:0;bottom:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;color:#fff}
</style>

<body>
<header class="bar"><div class="in"><h1>🔎 Lookup</h1>
  <div class="row"><select id="who" aria-label="Who's working"><option value="">Who's working?</option></select><a href="../">Hub</a></div></div></header>
<main class="wrap">
  <section class="card" id="setup" hidden>
    <h2>Connect this device</h2>
    <p class="small muted" style="margin:0 0 10px">Paste the MRM Photos Airtable key (starts with pat). Devices with MRM Photos, the Hub or Tech Bench set up are connected automatically.</p>
    <form id="setform" class="row" autocomplete="off"><input class="t" id="tok" type="password" placeholder="Airtable key (starts with pat)" spellcheck="false"><button class="btn" type="submit">Save and test</button></form>
    <div id="setmsg"></div>
  </section>

  <div class="seg" id="seg" hidden><button data-act="mode" data-m="items" class="on">Items</button><button data-act="mode" data-m="deals">Deals</button><button data-act="mode" data-m="cust">Customers</button></div>
  <section class="card" id="deals" hidden>
    <form id="dform" class="row"><input class="t" id="dq" inputmode="search" placeholder="Customer name" autocomplete="off" style="flex:1 1 180px;width:auto"><button class="btn" type="submit">Find</button></form>
    <div class="dates"><span class="small muted">Date</span><input type="date" id="dfrom" aria-label="From"><span class="small muted">to</span><input type="date" id="dto" aria-label="To">
      <button class="tab" data-act="drange" data-r="today">Today</button><button class="tab" data-act="drange" data-r="week">Last 7 days</button><button class="tab" data-act="drange" data-r="month">Last 30 days</button><button class="tab" data-act="drange" data-r="all">Any date</button></div>
    <div class="tabs" id="dtabs" style="margin-top:10px"></div>
    <div id="dmsg"></div>
    <div class="list" id="dlist"></div>
  </section>
  <section id="deal" hidden></section>
  <section class="card" id="custs" hidden>
    <form id="cform" class="row"><input class="t" id="cq" inputmode="search" placeholder="Customer name, email or phone" autocomplete="off" style="flex:1 1 180px;width:auto"><button class="btn" type="submit">Find</button></form>
    <div id="cmsg"><div class="small muted" style="margin-top:10px">Find a customer to see everything we've bought, traded or taken on consignment from them.</div></div>
    <div class="list" id="clist"></div>
  </section>
  <section id="cust" hidden></section>
  <section class="card" id="browse" hidden>
    <div class="row"><form id="sform" class="row" style="flex:1 1 260px"><input class="t" id="q" inputmode="search" placeholder="SKU, name, brand, model…" autocomplete="off" style="flex:1 1 160px;width:auto"><button class="btn" type="submit">Find</button></form><button class="btn sec" id="scanbtn" type="button">▦ Scan</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="bmsg"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="item" hidden></section>
</main>
<div class="scan" id="scanner" hidden><video id="vid" playsinline muted></video><div class="frame"></div>
  <div class="foot"><div>Point at the SKU barcode</div><button class="btn sec" id="stopscan" style="min-width:160px">Cancel</button></div></div>

<script>
"use strict";
const BASE="appZD2jJGbSlvofcV", TABLE="tbleYgUhKCIepPtFR";
const STAFF=(function(){ var fb=["Jon","Sam","Nina","Julia","Ethan","Kyle","Andy","Jeff","Chris","Sturgis","Mike"]; try{ var c=JSON.parse(localStorage.getItem("mrm-staff")||"null"); if(Array.isArray(c)&&c.length) return c; }catch(e){} return fb; })();
(function(){ try{ fetch("https://api.airtable.com/v0/appZD2jJGbSlvofcV/tbluogAt5hDWgzbgi?filterByFormula="+encodeURIComponent("{In Apps}")+"&fields%5B%5D=Name&fields%5B%5D=Can%20Approve&fields%5B%5D=Departments",{headers:{Authorization:"Bearer via-hub"}}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(!j||!j.records||!j.records.length) return; var rs=j.records.filter(function(r){return r.fields&&r.fields.Name;}); if(!rs.length) return; var n=rs.map(function(r){return r.fields.Name;}); var ap=rs.filter(function(r){return r.fields["Can Approve"];}).map(function(r){return r.fields.Name;}); var ids={}; rs.forEach(function(r){ids[r.fields.Name]=r.id;}); var depts={}; rs.forEach(function(r){depts[r.fields.Name]=r.fields.Departments||[];});
  try{ localStorage.setItem("mrm-staff",JSON.stringify(n)); localStorage.setItem("mrm-approvers",JSON.stringify(ap)); localStorage.setItem("mrm-staff-ids",JSON.stringify(ids)); localStorage.setItem("mrm-staff-depts",JSON.stringify(depts)); }catch(e){}
  var changed=n.join("|")!==STAFF.join("|"); STAFF.splice.apply(STAFF,[0,STAFF.length].concat(n)); window.STAFF_IDS=ids; window.STAFF_DEPTS=depts; if(changed&&typeof window.onStaff==="function") window.onStaff(); }).catch(function(){}); }catch(e){} })();
const FX={ name:"flde17o9HEpKPdMlS", sku:"fldfKGlajXOBkUQ92", status:"fldQNSoYTvTVEIgwG", phys:"fldM1ajllQvTvdKwI", cat:"fldRSem0EtiWihkN1", cond:"fldYuGbUJO4a0bNvu", notes:"fldW0Sgi7TVduheu1",
  serial:"fldt6OBgEhIwhEvjP", dateIn:"fldf0h1eW3dxrlufr", seller:"fldTyF7VCWXfIcpJm", cost:"fldg6j6emzCkDiGaI", esp:"fldkODnsYDRYqeOOm", pos:"fld0ESkFoFMOhfR0g", online:"fldd9UhO7Ld2Io9f0", newPrice:"fld6COeapNgbSjGQX",
  repairEst:"fldSuGcsrYx8FGajQ", repairCost:"fldQdlwr3NdLnkNxW", location:"fldZICzZjZ7MEwPs3", urls:"fldsABSqaxA6WfmUL", img1:"fldECxEFzuwWNZoDi",
  intakeType:"fldUhYtVjkyGTZgw4", make:"fldrk4O58Pt7F1bez", model:"fldVoULHvGrxjP6FI", year:"fldTH1EvXbtdRpqLX", finish:"flduMrOukLdpZa903", desc:"fldK4r1UVR5CMLNwZ", reverbUrl:"fldxpwguYzuqHGNrk", live:"fldhDcy7R5md05jLL",
  ecom:"fldX0VOsDANQgy19J", descDone:"fldBLrfIlQl4L6TTg", syncStatus:"fldAYVCBr0NvScNGw", lsSync:"fldaLAXj2wSSleZZB", dateSold:"fldE8Lo8KkVQep2RL", listedBy:"fldmEXUkfXzeXUwEl", ship:"fldMXyf3MJT81bP8H" };
const PHYS=["TBD","Needs Work: Guitar Repair","Needs Work: Electronics Repair","Needs Work: Tube Amp Repair","Needs Work: Horn Repair","Needs Work: Misc","Ready to Sell","Hold","Parts","Long Term Project","Tag Sale","Listed","Sold"];
const LOCS=["Intake Room","Sales Floor","Repair","Repair(Humidifying)","Front caseland","Shop Stock","Mezzanine Overflow","Drum Loft","Easthampton Storage","Climate Controlled Storage","Eho 2","J&N Garage","Rust Temple"];
const DS=x=>`TRIM({Data Status}&'')='${x}'`;
const TABS=[
  {k:"all", label:"Everything", f:"TRUE()", note:"Every item in the Purchase Log, newest first. Showing the latest 300; search to find anything older.", nocount:true},
  {k:"pos", label:"Waiting POS sync", f:DS("Purchased / Approved"), note:"Bought and approved, not in Lightspeed yet. Red lines show what's probably holding it up."},
  {k:"store", label:"In store only", f:DS("POS Synced"), note:"In Lightspeed, not sent online yet."},
  {k:"going", label:"Going online", f:`AND(${DS("Ready For Ecommerce")},{Listing Live?}!='Live')`, note:"Sent to Reverb/website but not confirmed live yet."},
  {k:"live", label:"Listed (live)", f:`AND(${DS("Ready For Ecommerce")},{Listing Live?}='Live')`, note:"Live online."},
  {k:"pending", label:"Pending / hold", f:`OR(${DS("Pending")},${DS("Hold")},${DS("Awaiting Consigner Approval")},${DS("Potential Deal")})`, note:"Pending deals, holds and consignments awaiting approval."},
  {k:"sold", label:"Sold", f:DS("Sold"), note:"Most recent 100 by date in.", max:100},
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={ get(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let TOKEN=store.get("mrm-photos-token"), WHO=store.get("mrm-photos-who");
let TAB=(()=>{ const m=/[?&]tab=(\w+)/.exec(location.search); return m&&TABS.some(t=>t.k===m[1])?m[1]:"all"; })();
let ROWS=[], COUNTS={}, REC=null, busy=false, editing=false, pending=null, searchQ="";

const num=v=>{ const x=parseFloat(String(v??"").replace(/[$,]/g,"")); return isFinite(x)?x:null; };
const money=v=>{ const x=num(v); return x?"$"+x.toLocaleString("en-US"):""; };
const f=(r,k)=>{ const v=r&&r.fields&&r.fields[FX[k]]; if(v==null) return ""; if(Array.isArray(v)) return v.map(x=>x&&typeof x==="object"?(x.name??x.filename??""):x).join(", "); if(typeof v==="object") return v.text??v.name??""; return v; };
const quote=s=>"'"+String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'";
const st=r=>String(f(r,"status")||"").trim();

/* ---------- Airtable (reads) ---------- */
async function api(path,opt){ const r=await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}${path||""}`,{...opt,headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"}});
  const j=await r.json().catch(()=>({})); if(!r.ok){ const m=(j.error&&(j.error.message||j.error.type))||("HTTP "+r.status); throw new Error(r.status===401||r.status===403?"Airtable didn't accept the key ("+m+").":m); } return j; }
const FQ=Object.values(FX).filter(x=>x!==FX.desc).map(x=>"fields%5B%5D="+x).join("&");
async function query(formula,max){ let out=[], offset="";
  do{ let p=`?returnFieldsByFieldId=true&${FQ}&pageSize=100&filterByFormula=${encodeURIComponent(formula)}&sort%5B0%5D%5Bfield%5D=${FX.dateIn}&sort%5B0%5D%5Bdirection%5D=desc`; if(offset) p+="&offset="+encodeURIComponent(offset);
    const j=await api(p); out=out.concat(j.records||[]); offset=j.offset||""; }while(offset&&out.length<(max||300));
  return out.slice(0,max||300); }
async function countF(fml){ let n=0, offset="", pages=0;
  do{ const j=await api(`?pageSize=100&fields%5B%5D=${FX.name}&filterByFormula=${encodeURIComponent(fml)}${offset?"&offset="+encodeURIComponent(offset):""}`); n+=(j.records||[]).length; offset=j.offset||""; pages++; }while(offset&&pages<10);
  return offset?n+"+":n; }

/* ---------- browse ---------- */
function renderTabs(){ $("tabs").innerHTML=TABS.map(t=>`<button class="tab ${t.k===TAB&&!searchQ?"on":""}" data-act="tab" data-k="${t.k}">${esc(t.label)}<span class="n">${COUNTS[t.k]!==undefined?COUNTS[t.k]:""}</span></button>`).join(""); }
async function loadTab(){ searchQ=""; renderTabs(); const t=TABS.find(x=>x.k===TAB); renderList("Loading…");
  try{ ROWS=await query(t.f,t.max||300); renderList(`${esc(t.note)}${ROWS.length>=300&&t.k!=="all"?" Showing the newest 300.":""}`); }catch(e){ ROWS=[]; renderList(esc(e.message)); } }
async function loadCounts(){ await Promise.all(TABS.filter(t=>t.k!=="sold"&&!t.nocount).map(async t=>{ try{ COUNTS[t.k]=await countF(t.f); }catch(e){ COUNTS[t.k]="?"; } })); renderTabs(); }
async function find(q){ q=String(q||"").trim(); if(!q) return loadTab(); searchQ=q; renderTabs(); renderList("Looking…");

$("dform").addEventListener("submit",e=>{ e.preventDefault(); $("dq").blur(); loadDeals(); });
["dfrom","dto"].forEach(id=>$(id).addEventListener("change",()=>loadDeals()));
$("sform").addEventListener("submit",e=>{ e.preventDefault(); $("q").blur(); find($("q").value); });
$("scanbtn").addEventListener("click",scan); $("stopscan").addEventListener("click",stopScan);
$("who").innerHTML=`<option value="">Who's working?</option>`+STAFF.map(n=>`<option ${n===WHO?"selected":""}>${n}</option>`).join("");
$("who").addEventListener("change",e=>{ WHO=e.target.value; store.set("mrm-photos-who",WHO); });
$("setform").addEventListener("submit",async e=>{ e.preventDefault(); const t=$("tok").value.trim(); if(!/^pat/.test(t)){ $("setmsg").innerHTML=`<div class="note warn">Airtable keys start with "pat".</div>`; return; }
  const prev=TOKEN; TOKEN=t; try{ await api("?maxRecords=1&fields%5B%5D="+FX.name); store.set("mrm-photos-token",t); $("tok").value=""; start(); }catch(err){ TOKEN=prev; $("setmsg").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } });
function start(){ $("setup").hidden=!!TOKEN; $("browse").hidden=!TOKEN; $("seg").hidden=!TOKEN; if(!TOKEN) return;
  { const mm=(/[?&]mode=(deals|cust)/.exec(location.search)||[])[1]||(!/[?&](sku|q)=/.test(location.search)&&store.get("mrm-lookup-mode")); if(mm==="deals"||mm==="cust") setMode(mm); } const m=/[?&]sku=([^&#]+)/.exec(location.search)||/[?&]q=([^&#]+)/.exec(location.search);
  if(m){ $("q").value=decodeURIComponent(m[1]); find($("q").value); } else loadTab(); loadCounts(); }
start();
</script>
