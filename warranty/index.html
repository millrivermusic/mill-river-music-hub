async function at(table,path,opt){ const r=await fetch(`https://api.airtable.com/v0/${BASE}/${table}${path||""}`,{...opt,headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"}});

async function all(table,fields){ let out=[],off=""; do{ const qs="?pageSize=100&returnFieldsByFieldId=true"+fields.map(f=>"&fields%5B%5D="+f).join("")+(off?"&offset="+encodeURIComponent(off):""); const j=await at(table,qs); out=out.concat(j.records||[]); off=j.offset||""; }while(off); return out; }
const s=v=>v==null?"":Array.isArray(v)?v.map(x=>x&&typeof x==="object"?(x.name??x.filename??x.id??""):x).join(", "):typeof v==="object"?(v.name??""):String(v);
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtD=x=>{ if(!x) return ""; const d=new Date(x.length<=10?x+"T12:00:00":x); return isNaN(d)?x:d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const days=x=>x?Math.floor((Date.now()-new Date(x+"T12:00:00"))/864e5):null;
const shortD=()=>{ const d=new Date(); return (d.getMonth()+1)+"/"+d.getDate(); };

function keyOf(b,label){ const S=BR[b].S; for(const k in S) if(S[k]===label) return k; if(/paperwork/i.test(label)) return "paperwork"; return label?"pending":"pending"; }
function norm(b,r){ const F=BR[b].F, f=r.fields||{}; return { b, id:r.id, created:r.createdTime, custId:(f[F.cust]||[])[0]||"", model:s(f[F.model]), serial:s(f[F.serial]), notes:s(f[F.notes]), techId:(f[F.tech]||[])[0]||"",
  status:keyOf(b,s(f[F.status])), rawStatus:s(f[F.status]), num:s(f[F.num]), req:s(f[F.req]), wo:s(f[F.wo]), wos:s(f[F.wos]), woc:s(f[F.woc]), files:f[F.files]||[], appr:f[F.appr]||[], signed:f[F.signed]||[], photos:f[F.photos]||[], emIds:f[F.em]||[], threads:s(f[F.threads]).split(",").map(x=>x.trim()).filter(Boolean), amount:F.amount?f[F.amount]:null }; }
function custName(c){ const u=CUST[c.custId]; if(u) return u.name; return c.custId?"(customer)":(/shop stock/i.test(c.model)?"Shop stock":"No customer linked"); }
function flags(c){ const out=[]; const done=/done|paid|finished/i.test(c.wos);
  if(done && ["pending","waiting","emailed","approved","complete"].includes(c.status)) out.push("Lightspeed says the repair is "+c.wos+". Send the completion paperwork.");
  if(c.status==="approved" && !c.wo) out.push("Approved but no Lightspeed work order # yet.");
  if(c.status==="emailed" && days(c.req)>14) out.push("Emailed "+days(c.req)+" days ago with no answer. Follow up.");
  if((c.status==="pending"||c.status==="waiting") && days(c.req||c.created.slice(0,10))>30) out.push("Sitting in "+SLABEL[c.status]+" for a month+.");
  if(/Not found/.test(c.wos)) out.push("Work order #"+c.wo+" wasn't found in Lightspeed. Check the number.");
  return out; }

async function load(){ $("dmsg").innerHTML=`<div class="small muted">Loading cases…</div>`;
  try{ const [t,m]=await Promise.all(["taylor","martin"].map(b=>all(BR[b].table,Object.values(BR[b].F))));
    CASES=t.map(r=>norm("taylor",r)).concat(m.map(r=>norm("martin",r))).filter(c=>c.custId||c.model||c.serial||c.notes);
    const ids=[...new Set(CASES.map(c=>c.custId).filter(x=>x&&!CUST[x]))];
    for(let i=0;i<ids.length;i+=40){ const chunk=ids.slice(i,i+40); const f="OR("+chunk.map(x=>`RECORD_ID()='${x}'`).join(",")+")";
      const j=await at(UDB,"?returnFieldsByFieldId=true&pageSize=100&filterByFormula="+encodeURIComponent(f)+Object.values(U).map(x=>"&fields%5B%5D="+x).join(""));
      (j.records||[]).forEach(r=>{ CUST[r.id]=cu(r); }); }
    await loadUnseen();
    $("dmsg").innerHTML=""; render(); if(CUR){ const c=CASES.find(x=>x.id===CUR.id); if(c) openCase(c.id,true); } else if(/^#rec\w{14}$/.test(location.hash)&&CASES.some(x=>x.id===location.hash.slice(1))) openCase(location.hash.slice(1));
  }catch(e){ $("dmsg").innerHTML=`<div class="note warn">Couldn't load warranty cases: ${esc(e.message)}</div>`; } }
async function loadUnseen(){ UNSEEN={}; UNMATCHED=[];
  try{ const f=`OR(AND({Direction}='Received',NOT({Seen})),{Match}='unmatched')`; const rs=await allF(EM.table,[EM.subject,EM.from,EM.date,EM.taylor,EM.martin,EM.match,EM.body,EM.dir,EM.seen,EM.thread],f);
    const byT={};
    rs.forEach(r=>{ const F=r.fields||{}; const ids=(F[EM.taylor]||[]).concat(F[EM.martin]||[]);
      if(ids.length){ if(s(F[EM.dir])==="Received"&&!F[EM.seen]) ids.forEach(id=>UNSEEN[id]=(UNSEEN[id]||0)+1); }
      else if(F[EM.match]==="unmatched"){ const t=F[EM.thread]||r.id; (byT[t]=byT[t]||[]).push(r); } });
    UNMATCHED=Object.values(byT).map(list=>{ list.sort((a,b)=>String(b.fields[EM.date]).localeCompare(String(a.fields[EM.date]))); const top=list[0]; top._ids=list.map(x=>x.id); top._n=list.length; return top; })
      .sort((a,b)=>String(b.fields[EM.date]).localeCompare(String(a.fields[EM.date])));
  }catch(e){ /* table may not be readable yet */ } }
async function allF(table,fields,formula){ let out=[],off=""; do{ const qs="?pageSize=100&returnFieldsByFieldId=true"+fields.map(f=>"&fields%5B%5D="+f).join("")+(formula?"&filterByFormula="+encodeURIComponent(formula):"")+(off?"&offset="+encodeURIComponent(off):""); const j=await at(table,qs); out=out.concat(j.records||[]); off=j.offset||""; }while(off); return out; }
function cu(r){ const f=r.fields||{}; const nm=(s(f[U.name])||[s(f[U.first]),s(f[U.last])].filter(Boolean).join(" ")).trim()||"(no name)";
  return { id:r.id, name:nm, first:s(f[U.first]), last:s(f[U.last]), email:s(f[U.email]), phone:s(f[U.mobile])||s(f[U.phone]), addr:s(f[U.addr]), city:s(f[U.city]), state:s(f[U.state]), zip:s(f[U.zip]) }; }

/* ---------- dashboard ---------- */
function visible(){ const q=Q.toLowerCase().trim();
  return CASES.filter(c=>(BRAND==="all"||c.b===BRAND)&&(!TECH||(TECH==="none"?!c.techId:c.techId===STAFFREC[TECH]))&&(!OPENONLY||SFILT==="paid"||SFILT==="rejected"||SFILT==="passed"||(c.status!=="paid"&&c.status!=="rejected"&&c.status!=="passed"))&&(!SFILT||c.status===SFILT)&&(!ALERT||flags(c).length)&&(!NEWONLY||UNSEEN[c.id])&&(!q||[custName(c),c.model,c.serial,c.num,c.wo,c.notes].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(flags(b).length>0)-(flags(a).length>0)||ORDER.indexOf(a.status)-ORDER.indexOf(b.status)||String(b.req||b.created).localeCompare(String(a.req||a.created))); }
function render(){
  const byTech=c=>!TECH||(TECH==="none"?!c.techId:c.techId===STAFFREC[TECH]);
  const isOpen=c=>c.status!=="paid"&&c.status!=="rejected"&&c.status!=="passed";
  $("techs").innerHTML=[["","Everyone"],...TECHS.map(n=>[n,n]),["none","Unassigned"]].map(([k,l])=>{ const n=CASES.filter(c=>(!k||(k==="none"?!c.techId:c.techId===STAFFREC[k]))&&(!OPENONLY||isOpen(c))).length; return `<button class="chip brand ${TECH===k?"on":""}" data-act="tech" data-k="${k}">${l} <span class="n">${n}</span></button>`; }).join("");
  const inB=CASES.filter(c=>(BRAND==="all"||c.b===BRAND)&&byTech(c));
  $("brands").innerHTML=`<div class="seg">`+[["all","Martin + Taylor"],["martin","Martin"],["taylor","Taylor"]].map(([k,l])=>`<button class="chip brand ${BRAND===k?"on":""}" data-act="brand" data-k="${k}">${l} <span class="n">${CASES.filter(c=>(k==="all"||c.b===k)&&byTech(c)&&(!OPENONLY||isOpen(c))).length}</span></button>`).join("")+`</div>`+
    `<div class="seg"><button class="chip brand ${OPENONLY?"on":""}" data-act="openonly" data-k="1">Open</button><button class="chip brand ${!OPENONLY?"on":""}" data-act="openonly" data-k="0">All incl. closed</button></div>`;
  const nA=inB.filter(c=>flags(c).length).length;
  const nNew=inB.filter(c=>UNSEEN[c.id]).length;
  $("statuses").innerHTML=`<button class="chip alert ${ALERT?"on":""}" data-act="alert">⚠ Needs attention <span class="n">${nA}</span></button>`+
    `<button class="chip ${NEWONLY?"on":""}" style="background:var(--info-soft);color:var(--info);border-color:transparent" data-act="newonly">✉ New replies <span class="n">${nNew}</span></button>`+
    (UNMATCHED.length?`<button class="chip ${SHOWUNM?"on":""}" data-act="unm">📥 Unmatched emails <span class="n">${UNMATCHED.length}</span></button>`:"")+
    `<span class="vsep" aria-hidden="true"></span>`+ORDER.map(k=>{ const n=inB.filter(c=>c.status===k).length; return `<button class="chip s-${k} ${SFILT===k?"on":""}" data-act="sfilt" data-k="${k}">${SLABEL[k]} <span class="n">${n}</span></button>`; }).join("");
  if(SHOWUNM){ $("list").innerHTML=unmatchedView(); return; }
  const v=visible();
  $("list").innerHTML=v.length?v.map(c=>{ const fl=flags(c); return `<button class="res" data-act="open" data-id="${c.id}"><b><span class="brandtag">${BR[c.b].label}</span>${esc(custName(c))}${c.model?" · "+esc(c.model):""}</b><span class="pill s-${c.status}">${SLABEL[c.status]}</span>
    <span class="meta">${[c.serial&&"S/N "+c.serial, c.num&&(c.b==="martin"?"Auth ":"Ticket ")+c.num, c.wo&&"WO "+c.wo+(c.wos?" ("+c.wos+")":""), c.techId&&RECSTAFF[c.techId], c.req&&"Requested "+fmtD(c.req)].filter(Boolean).map(esc).join(" · ")}</span>
    ${UNSEEN[c.id]?`<span class="why" style="color:var(--info)">✉ ${UNSEEN[c.id]} new repl${UNSEEN[c.id]>1?"ies":"y"} from ${BR[c.b].label}</span>`:""}
    ${fl.length?`<span class="why">⚠ ${esc(fl[0])}</span>`:""}</button>`; }).join(""):`<div class="small muted">No cases match.</div>`;
}

/* ---------- email connection + unmatched ---------- */
function mailReady(){ return true; } /* sending goes through Airtable's outbox; no per-device setup */
async function mailCall(body){ const r=await fetch(MAILURL,{method:"POST",body:JSON.stringify({...body,secret:MAILKEY})}); const t=await r.text(); let j; try{ j=JSON.parse(t); }catch(e){ throw new Error("The info@ mail script didn't answer properly. Check the Web app URL."); } if(!j.ok) throw new Error(j.error||"Mail script error"); return j; }
function unmatchedView(){ const opts=CASES.map(c=>`<option value="${c.b}|${c.id}">${esc(BR[c.b].label+" · "+custName(c)+(c.model?" · "+c.model:"")+(c.serial?" · "+c.serial:""))}</option>`).join("");
  return `<div class="note">These came from Martin or Taylor but couldn't be matched to a case. Link each thread to its case (all its emails move together), or hide it if it isn't about a warranty case.</div>`+UNMATCHED.map(r=>{ const F=r.fields||{};
    return `<div class="mail"><div class="small muted">${esc(F[EM.from]||"")} · ${esc(fmtD(F[EM.date]))}</div><b>${esc(F[EM.subject]||"")}</b>${r._n>1?` <span class="pill s-rejected">${r._n} emails in thread</span>`:""}<pre style="max-height:160px;overflow:auto">${esc((F[EM.body]||"").slice(0,1500))}</pre>
      <div class="row" style="margin-top:6px"><select class="t" id="lk-${r.id}" style="flex:1 1 220px;width:auto"><option value="">Link to case…</option>${opts}</select><button class="btn sm" data-act="linkem" data-id="${r.id}">Link</button><button class="btn sec sm" data-act="hideem" data-id="${r.id}">Not warranty, hide</button></div></div>`; }).join(""); }
function mailSetupCard(){ return `<details class="card" ${mailReady()?"":"open"}><summary style="cursor:pointer;font-weight:800">✉ Email connection ${mailReady()?'<span class="pill s-paperwork">connected on this device</span>':'<span class="pill s-pending">not set up on this device</span>'}</summary>
  <p class="small muted">Paste the info@ mail script's Web app URL and secret (Jon has them). Once set, emails send from info@ right from each case, and replies from Martin and Taylor show up on the case.</p>
  <form class="form" id="mailform" autocomplete="off"><label class="f wide">Web app URL<input class="t" id="murl" value="${esc(MAILURL)}" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false"></label><label class="f wide">Secret<input class="t" id="mkey" type="password" value="${esc(MAILKEY)}" spellcheck="false"></label>
  <div class="row" style="grid-column:1/-1"><button class="btn" type="submit">Save and test</button>${mailReady()?'<button class="btn sec" type="button" data-act="syncnow">Check for new email now</button>':""}<span id="mailmsg" class="small"></span></div></form></details>`; }

/* ---------- case detail ---------- */
function show(which){ $("dash").hidden=which!=="dash"; $("detail").hidden=which!=="detail"; $("create").hidden=which!=="create"; window.scrollTo(0,0); }
function openCase(id,keep){ const c=CASES.find(x=>x.id===id); if(!c) return; CUR=c; if(!keep) MAILKIND=defaultMail(c); const B=BR[c.b], u=CUST[c.custId];
  const fl=flags(c);
  $("detail").innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><button class="btn sec sm" data-act="back">← All cases</button><a class="btn sec sm" href="https://airtable.com/${BASE}/${B.table}/${c.id}" target="_blank" rel="noopener">Open in Airtable</a></div>
    <h2 style="margin-top:12px"><span class="brandtag">${B.label}</span>${esc(custName(c))}${c.model?" · "+esc(c.model):""}</h2>
    ${fl.length?`<div class="flags">${fl.map(x=>`<div class="note warn">⚠ ${esc(x)}</div>`).join("")}</div>`:""}
    <h3>Status</h3>
    <div class="statusbar">${ORDER.map(k=>`<button class="s-${k} ${c.status===k?"on":""}" data-act="setst" data-k="${k}">${SLABEL[k]}</button>`).join("")}</div>
    <div id="stconfirm"></div>
    ${c.wo?`<div class="small muted" style="margin-top:8px">Lightspeed WO #${esc(c.wo)}: <b>${esc(c.wos||"not checked yet")}</b>${c.woc?" · checked "+esc(fmtD(c.woc)):""}</div>`:""}

    <h3>Customer</h3>
    ${u?`<dl class="kv"><dt>Name</dt><dd>${esc(u.name)}</dd>${u.email?`<dt>Email</dt><dd>${esc(u.email)}</dd>`:""}${u.phone?`<dt>Phone</dt><dd>${esc(u.phone)}</dd>`:""}${u.addr||u.city?`<dt>Address</dt><dd>${esc([u.addr,[u.city,u.state].filter(Boolean).join(", "),u.zip].filter(Boolean).join(" "))}</dd>`:""}</dl>`:`<div class="small muted">${esc(custName(c))}</div>`}
    <div class="row" style="margin-top:6px"><input class="t" id="cq" placeholder="${u?"Change customer: search name":"Link a customer: search name"}" autocomplete="off" style="flex:1 1 200px;width:auto"></div><div class="sugg" id="csugg"></div>

    <h3>Details</h3>
    <form class="form" id="eform">
      <label class="f">Model<input class="t" name="model" value="${esc(c.model)}"></label>
      <label class="f">Serial #<input class="t" name="serial" value="${esc(c.serial)}"></label>
      <label class="f">${B.numLabel}<input class="t" name="num" value="${esc(c.num)}"></label>
      <label class="f">Lightspeed work order #<input class="t" name="wo" value="${esc(c.wo)}" inputmode="numeric"></label>
      <label class="f">Requested<input class="t" type="date" name="req" value="${esc(c.req)}"></label>
      <label class="f">Tech<select class="t" name="tech"><option value="">—</option>${Object.keys(STAFFREC).map(n=>`<option value="${STAFFREC[n]}" ${c.techId===STAFFREC[n]?"selected":""}>${n}</option>`).join("")}</select></label>
      ${c.b==="martin"?`<label class="f">Payout amount<input class="t" name="amount" inputmode="decimal" value="${c.amount??""}"></label>`:""}
      <div class="row" style="grid-column:1/-1"><button class="btn" type="submit">Save details</button><span id="emsg" class="small"></span></div>
    </form>

    <h3>Notes & history</h3>
    <div class="notebox">${esc(c.notes)||'<span class="muted">No notes yet.</span>'}</div>
    <form class="row" id="nform" style="margin-top:8px"><input class="t" id="nt" placeholder="Add a note (saved with today's date and your name)" style="flex:1 1 240px;width:auto"><button class="btn sec" type="submit">Add note</button></form>
    ${BOXES.map(k=>fileBox(c,k)).join("")}
    <div id="frm"></div>
  </div>
  <div class="card" id="mailcard"></div>`;
  renderMail(); show("detail"); }

function defaultMail(c){ if(c.status==="pending"||c.status==="waiting") return "request"; if(c.status==="emailed") return "follow"; if(c.status==="approved"||c.status==="complete") return "paperwork"; return "follow"; }
function mailFor(c0,kind){ const c={...c0,model:String(c0.model||"").replace(/^(martin|taylor)\s+/i,"")}; const u=CUST[c.custId]||{}, B=BR[c.b], me=WHO||"Mill River Music", last=(u.last||custName(c).split(" ").slice(-1)[0]||"").trim();
  const issue=($("mi")&&$("mi").value.trim())||firstLine(c.notes); const bought=($("mb")&&$("mb").value.trim())||"";
  const sig=`\n\nThank you,\n-${me}\n\n--\n${SHOP.name}\n${SHOP.addr}\n${SHOP.phone}\n${SHOP.email}`;
  const gtr=`${B.label==="Martin"?"":"Taylor "}${c.model||"guitar"}${c.serial?`, serial ${c.serial}`:""}`;
  if(c.b==="martin"){
    if(kind==="request") return { su:`Warranty Request Form, ${last||custName(c)}`, body:`Hi Meagan,\n\nWe have a customer, ${custName(c)}, with a Martin ${c.model||""}${c.serial?` (serial ${c.serial})`:""}. ${issue}${bought?`\n\nPurchased: ${bought}.`:""}\n\nAttached are the warranty request form, photos and the receipt. Please let us know if you need anything else.${sig}` };
    if(kind==="follow") return { su:`Following up: warranty request, ${last||custName(c)}${c.serial?` (${c.serial})`:""}`, body:`Hi Meagan,\n\nJust following up on the warranty request for ${custName(c)}'s Martin ${c.model||""}${c.serial?`, serial ${c.serial}`:""}${c.req?`, sent ${fmtD(c.req)}`:""}. Is there anything else you need from us?${sig}` };
    return { su:`Completed warranty paperwork${c.num?`, Auth #${c.num}`:""}, ${last||custName(c)}`, body:`Hi Meagan,\n\nThe warranty work for ${custName(c)}'s Martin ${c.model||""}${c.serial?` (serial ${c.serial})`:""}${c.num?`, authorization #${c.num},`:""} is complete. The signed completion paperwork is attached.${sig}` };
  }
  const owner=[custName(c), u.email, u.phone, [u.addr,[u.city,u.state].filter(Boolean).join(", "),u.zip].filter(Boolean).join(" ")].filter(Boolean).join("\n");
  if(kind==="request") return { su:`Warranty request: ${c.model||"Taylor"} ${c.serial||""} (${custName(c)})`.replace(/\s+/g," "), body:`Hi SV Network team,\n\nWe have a warranty request for a ${gtr}.\n\nIssue: ${issue}\n${bought?`Purchased: ${bought}\n`:""}\nOwner:\n${owner}\n\nPhotos${bought?" and the sales receipt":""} are attached. Please let us know if you need anything else to open a ticket.${sig}` };
  if(kind==="follow") return { su:`Following up: ${c.num?`ticket #${c.num}`:"warranty request"}, ${c.model||""} ${c.serial||""}`.replace(/\s+/g," "), body:`Hi SV Network team,\n\nFollowing up on ${c.num?`ticket #${c.num}`:"our warranty request"} for ${custName(c)}'s ${gtr}${c.req?`, sent ${fmtD(c.req)}`:""}. Is there anything else you need from us?${sig}` };
  return { su:`Work complete: ${c.num?`ticket #${c.num}, `:""}${c.model||""} ${c.serial||""}`.replace(/\s+/g," "), body:`Hi SV Network team,\n\nThe warranty repair for ${custName(c)}'s ${gtr}${c.num?` (ticket #${c.num})`:""} is complete. The completed service paperwork is attached for reimbursement.${sig}` };
}
/* ---------- files ---------- */
const BOXES=["appr","signed","files","photos"];
const BOXLABEL=(c,k)=>({appr:BR[c.b].label+" Approved Form",signed:"Signed by Customer Form",files:"Other Attachments (receipts, request form, etc.)",photos:"Photos"})[k];
function fileBox(c,k){ const list=c[k]||[]; const ph=k==="photos";
  return `<h3>${esc(BOXLABEL(c,k))}</h3><div class="drop" data-box="${k}">
    ${ph&&list.length?`<div class="thumbs">${list.map((a,i)=>`<div class="ph"><a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc((a.thumbnails&&a.thumbnails.large||a).url)}" alt="${esc(a.filename)}"></a><button class="x" data-act="frm" data-k="${k}" data-i="${i}" title="Remove">✕</button></div>`).join("")}</div>`:""}
    ${!ph?`<div class="flist">${list.length?list.map((a,i)=>fileRow(a,i,k)).join(""):'<div class="small muted">Nothing here yet.</div>'}</div>`:(list.length?"":'<div class="small muted">No photos yet.</div>')}
    <div class="row" style="margin-top:8px"><label class="btn sec sm" style="cursor:pointer">＋ Add ${ph?"photos":"file"}<input type="file" class="fin" data-k="${k}" multiple accept="${ph?"image/*":"image/*,application/pdf,.doc,.docx"}" hidden></label>
      ${ph||k==="signed"?`<label class="btn sec sm" style="cursor:pointer">📷 Take photo<input type="file" class="fin" data-k="${k}" accept="image/*" capture="environment" hidden></label>`:""}
      <span class="small muted">or drag here</span></div><div class="fmsg" data-k="${k}"></div></div>`; }
function fileRow(a,i,k){ const img=/^image\//.test(a.type||""); const th=img&&a.thumbnails&&a.thumbnails.small?`<img src="${esc(a.thumbnails.small.url)}" alt="">`:(/pdf/.test(a.type||"")?"📄":"📎");
  const kb=a.size?(a.size>1048576?(a.size/1048576).toFixed(1)+" MB":Math.round(a.size/1024)+" KB"):"";

  const words=q.toLowerCase().split(/\s+/).filter(Boolean).slice(0,4).map(w=>w.replace(/\\/g,"\\\\").replace(/'/g,"\\'"));
  const f="AND("+words.map(w=>`FIND('${w}',LOWER({Name}&' '&{First Name}&' '&{Last Name}&' '&{E-mail}))`).join(",")+")";
  try{ const j=await at(UDB,"?pageSize=8&returnFieldsByFieldId=true&filterByFormula="+encodeURIComponent(f)+Object.values(U).map(x=>"&fields%5B%5D="+x).join(""));
    const rs=(j.records||[]).map(cu); rs.forEach(r=>CUST[r.id]=r);
    box.innerHTML=rs.length?rs.map(r=>`<button type="button" data-pick="${r.id}"><b>${esc(r.name)}</b> <span class="small muted">${esc([r.email,r.phone,r.city].filter(Boolean).join(" · "))}</span></button>`).join(""):`<div class="small muted">No match.</div>`;
    box.onclick=e=>{ const b=e.target.closest("[data-pick]"); if(b) pick(CUST[b.dataset.pick]); };
  }catch(e){ box.innerHTML=`<div class="small muted">Search failed: ${esc(e.message)}</div>`; } }

/* ---------- events ---------- */
let tq=null;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ Q=e.target.value; render(); }
  if(e.target.id==="mi"||e.target.id==="mb") updMail();
  if(e.target.id==="msu"||e.target.id==="mbody"){ MAILEDIT=true; updGm(); }
  if(e.target.classList&&e.target.classList.contains("wrf")&&CUR) store.set("mrm-wrf-"+CUR.id,JSON.stringify(wrfVals()));
  if(e.target.id==="cq"||e.target.id==="ncq"){ clearTimeout(tq); const el=e.target; tq=setTimeout(()=>{
    if(el.id==="cq") custSearch(el.value,$("csugg"),async u=>{ try{ await patch(CUR,{[BR[CUR.b].F.cust]:[u.id]}); render(); openCase(CUR.id,true); }catch(err){ $("csugg").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } });
    else custSearch(el.value,$("nsugg"),u=>{ NEW.cust=u; drawCreate(); }); },300); }
});
document.addEventListener("click",async e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="brand"){ BRAND=b.dataset.k; store.set("mrm-war-brand",BRAND); render(); }
  else if(a==="sfilt"){ SFILT=SFILT===b.dataset.k?"":b.dataset.k; ALERT=false; render(); }
  else if(a==="alert"){ ALERT=!ALERT; SFILT=""; render(); }
  else if(a==="open") openCase(b.dataset.id);
  else if(a==="back"){ CUR=null; show("dash"); render(); }
  else if(a==="setst"){ const k=b.dataset.k; if(k===CUR.status) return;
    $("stconfirm").innerHTML=`<div class="confirm"><b>Change to “${SLABEL[k]}”?</b><div class="form" style="margin-top:8px"><label class="f wide">Note (optional)<input class="t" id="stnote" placeholder="e.g. Martin approved, auth in email"></label></div><div class="row" style="margin-top:8px"><button class="btn" data-act="stok" data-k="${k}">Yes, change it</button><button class="btn sec" data-act="stno">Cancel</button></div></div>`; }
  else if(a==="stno") $("stconfirm").innerHTML="";
  else if(a==="stok"){ b.disabled=true; try{ await setStatus(b.dataset.k,($("stnote").value.trim()?SLABEL[b.dataset.k]+": "+$("stnote").value.trim():"Status → "+SLABEL[b.dataset.k])); }catch(err){ $("stconfirm").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } }
  else if(a==="mk"){ MAILKIND=b.dataset.k; renderMail(); }
  else if(a==="copy"){ const m=curMail(); const t="To: "+BR[CUR.b].to+"\nSubject: "+m.su+"\n\n"+m.body;
    try{ await navigator.clipboard.writeText(t); $("mmsg").innerHTML=`<div class="note ok">Copied.</div>`; }catch(err){ const r=document.createRange(); r.selectNodeContents($("mbody")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); $("mmsg").innerHTML=`<div class="note">Text selected. Press Copy.</div>`; } }
  else if(a==="markemailed"){ b.disabled=true; try{ await setStatus("emailed","Emailed "+BR[CUR.b].toName+" the warranty request"); }catch(err){ $("mmsg").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } }
  else if(a==="markpaper"){ b.disabled=true; try{ await setStatus("paperwork","Sent completion paperwork to "+BR[CUR.b].toName); }catch(err){ $("mmsg").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } }
  else if(a==="wrf"){ b.disabled=true; $("wrfmsg").textContent="Making the PDF…"; try{ const r=await makeWrf(CUR); $("wrfmsg").innerHTML=`Downloaded <b>${esc(r.name)}</b>. `+(r.saved?"A copy is saved to this case's files.":"Couldn't save a copy to Airtable; attach the downloaded file."); if(r.saved) setTimeout(load,1500); }catch(err){ $("wrfmsg").textContent=err.message; } b.disabled=false; }
  else if(a==="frm"){ const k=b.dataset.k; const f=(CUR[k]||[])[+b.dataset.i]; if(!f) return; $("frm").innerHTML=`<div class="confirm"><b>Remove “${esc(f.filename)}” from this case?</b><div class="small" style="margin-top:4px">Download it first if you might need it again.</div><div class="row" style="margin-top:8px"><button class="btn" data-act="frmok" data-k="${k}" data-id="${esc(f.id)}">Yes, remove it</button><button class="btn sec" data-act="frmno">Cancel</button></div></div>`; $("frm").scrollIntoView({block:"nearest"}); }
  else if(a==="frmno") $("frm").innerHTML="";
  else if(a==="frmok"){ b.disabled=true; try{ const k=b.dataset.k; const keep=(CUR[k]||[]).filter(x=>x.id!==b.dataset.id).map(x=>({id:x.id})); await patch(CUR,{[BR[CUR.b].F[k]]:keep}); await refreshCase(CUR); }catch(err){ $("frm").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } }
  else if(a==="tech"){ TECH=b.dataset.k; store.set("mrm-war-tech",TECH); render(); }
  else if(a==="openonly"){ OPENONLY=b.dataset.k==="1"; store.set("mrm-war-open",OPENONLY?"1":"0"); render(); }
  else if(a==="mreset"){ e.preventDefault(); updMail(true); }
  else if(a==="newonly"){ NEWONLY=!NEWONLY; SHOWUNM=false; render(); }
  else if(a==="unm"){ SHOWUNM=!SHOWUNM; render(); }
  else if(a==="linkem"){ const v=$("lk-"+b.dataset.id).value; if(!v) return; const [br,cid]=v.split("|"); b.disabled=true; const top=UNMATCHED.find(r=>r.id===b.dataset.id); const ids=top&&top._ids||[b.dataset.id];
    try{ for(let i=0;i<ids.length;i+=10) await at(EM.table,"",{method:"PATCH",body:JSON.stringify({records:ids.slice(i,i+10).map(id=>({id,fields:{[br==="taylor"?EM.taylor:EM.martin]:[cid],[EM.match]:"linked by "+(WHO||"staff")}}))})});
      const c=CASES.find(x=>x.id===cid), t=top&&top.fields[EM.thread]; if(c&&t&&!c.threads.includes(t)) await patch(c,{[BR[c.b].F.threads]:c.threads.concat([t]).join(",")});
      await load(); }catch(err){ alertBox(err.message); } }
  else if(a==="hideem"){ b.disabled=true; const top=UNMATCHED.find(r=>r.id===b.dataset.id); const ids=top&&top._ids||[b.dataset.id];
    try{ for(let i=0;i<ids.length;i+=10) await at(EM.table,"",{method:"PATCH",body:JSON.stringify({records:ids.slice(i,i+10).map(id=>({id,fields:{[EM.seen]:true,[EM.match]:"hidden by "+(WHO||"staff")}}))})}); UNMATCHED=UNMATCHED.filter(r=>r.id!==b.dataset.id); render(); }catch(err){ alertBox(err.message); } }
  else if(a==="syncnow"){ b.disabled=true; $("mailmsg").textContent="Checking info@…"; try{ const j=await mailCall({action:"sync"}); $("mailmsg").textContent=`Done. ${j.added} new email${j.added===1?"":"s"}.`; await load(); }catch(err){ $("mailmsg").textContent=err.message; } b.disabled=false; }
  else if(a==="msend"){ const m=curMail(); const files=allFiles(CUR); const picked=[...document.querySelectorAll(".matt:checked")].map(x=>files[+x.dataset.i]);
    if(!m.su||!m.body.trim()){ $("mmsg").innerHTML='<div class="note warn">Add a subject and message first.</div>'; return; }
    if(!WHO){ $("mmsg").innerHTML='<div class="note warn">Pick who\'s working (top right) first.</div>'; return; }
    $("mconfirm").innerHTML=`<div class="confirm"><b>Send this email now?</b><dl class="kv" style="margin-top:6px"><dt>To</dt><dd>${esc(BR[CUR.b].to)}</dd><dt>Subject</dt><dd>${esc(m.su)}</dd><dt>Attachments</dt><dd>${picked.length?picked.map(x=>esc(x.filename)).join("<br>"):"none"}</dd><dt>From</dt><dd>info@millrivermusic.com (sent by ${esc(WHO)})</dd></dl>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="msendok">Yes, send it</button><button class="btn sec" data-act="msendno">Cancel</button></div></div>`; }
  else if(a==="msendno") $("mconfirm").innerHTML="";
  else if(a==="mread"){ const c=CUR; if(!c) return; if(!WHO){ alertBox("Pick who's working (top right) first."); return; } const ids=b.dataset.ids.split(",").filter(Boolean); b.disabled=true;
    try{ await markSeen(ids); await patch(c,{[BR[c.b].F.notes]:(c.notes?c.notes+"\n\n":"")+noteLine("Marked "+(ids.length>1?ids.length+" emails":"email")+" from "+BR[c.b].toName+" read, no reply needed")}).catch(()=>{}); await refreshCase(c); }
    catch(err){ alertBox(err.message); b.disabled=false; } }
  else if(a==="msendok"){ b.disabled=true; const c=CUR, B=BR[c.b]; const m=curMail(); const files=allFiles(c); const picked=[...document.querySelectorAll(".matt:checked")].map(x=>files[+x.dataset.i]);
    const replyT=MAILKIND!=="request"&&c.threads.length?c.threads[c.threads.length-1]:"";
    $("mconfirm").innerHTML='<div class="note">Sending…</div>';
    try{ const rec=await at(EM.table,"",{method:"POST",body:JSON.stringify({typecast:true,returnFieldsByFieldId:true,records:[{fields:{[EM.subject]:m.su,[EM.dir]:"Outbox",[EM.to]:B.to,[EM.body]:m.body,[EM.date]:new Date().toISOString(),
        [EM.files]:picked.map(x=>({url:x.url,filename:x.filename})),[c.b==="taylor"?EM.taylor:EM.martin]:[c.id],[EM.sentBy]:WHO,[EM.thread]:replyT,[EM.sendStatus]:"Queued",[EM.seen]:true,[EM.match]:"queued from app"}}]})});
      const id=rec.records[0].id; let st="Queued", err="";
      for(let i=0;i<30&&(st==="Queued"||st==="Sending");i++){ $("mconfirm").innerHTML=`<div class="note">${st==="Sending"?"Sending from info@…":"Queued, waiting for info@ to send…"}</div>`; await new Promise(r=>setTimeout(r,3000));
        const j=await at(EM.table,"/"+id+"?returnFieldsByFieldId=true"); st=s(j.fields[EM.sendStatus]); err=s(j.fields[EM.sendError]); }
      if(st==="Failed") throw new Error(err||"info@ couldn't send it.");
      if(st!=="Sent"){ $("mconfirm").innerHTML='<div class="note">It\'s queued and info@ will send it within 10 minutes. It will show in the conversation below once sent. Change the status yourself after that.</div>'; await refreshCase(c); return; }
      $("mconfirm").innerHTML='<div class="note ok">Sent from info@.</div>'; await markSeen(c.unseenIds||[]).catch(()=>{});
      const kind=MAILKIND, lbl={request:"warranty request",follow:"follow-up",paperwork:"completion paperwork"}[kind];
      if(kind==="request"&&(c.status==="pending"||c.status==="waiting")) await setStatus("emailed","Emailed "+B.toName+" the "+lbl);
      else if(kind==="paperwork"&&c.status!=="paperwork"&&c.status!=="paid") await setStatus("paperwork","Sent "+lbl+" to "+B.toName);
      else { await patch(c,{[B.F.notes]:(c.notes?c.notes+"\n\n":"")+noteLine("Sent "+lbl+" to "+B.toName)}); }
      await refreshCase(c);
    }catch(err){ $("mconfirm").innerHTML=`<div class="note warn">Not sent: ${esc(err.message)}</div>`; } }
  else if(a==="nb"){ NEW.b=b.dataset.k; drawCreate(); }
  else if(a==="nclear"){ NEW.cust=null; drawCreate(); }
});
document.addEventListener("submit",async e=>{ e.preventDefault(); const fm=e.target;
  if(fm.id==="mailform"){ const u=$("murl").value.trim(), k=$("mkey").value.trim(); const pu=MAILURL, pk=MAILKEY; MAILURL=u; MAILKEY=k; $("mailmsg").textContent="Testing…";
    try{ const j=await mailCall({action:"ping"}); store.set("mrm-war-mailurl",u); store.set("mrm-war-mailkey",k); $("mailmsg").textContent="Connected as "+j.account+"."; setTimeout(render,1200); }catch(err){ MAILURL=pu; MAILKEY=pk; $("mailmsg").textContent=err.message; } return; }
  if(fm.id==="setform"){ const t=$("tok").value.trim(); const prev=TOKEN; TOKEN=t; try{ await at(BR.martin.table,"?maxRecords=1"); store.set("mrm-photos-token",t); start(); }catch(err){ TOKEN=prev; $("setmsg").innerHTML=`<div class="note warn">${esc(err.message)}</div>`; } }
  else if(fm.id==="eform"){ const B=BR[CUR.b], d=Object.fromEntries(new FormData(fm)); const fields={[B.F.model]:d.model.trim(),[B.F.serial]:d.serial.trim(),[B.F.num]:d.num.trim(),[B.F.wo]:d.wo.replace(/[^0-9]/g,""),[B.F.req]:d.req||null,[B.F.tech]:d.tech?[d.tech]:[]};
    if(B.F.amount) fields[B.F.amount]=d.amount===""?null:parseFloat(String(d.amount).replace(/[$,]/g,""));
    $("emsg").textContent="Saving…"; try{ await patch(CUR,fields); render(); openCase(CUR.id,true); }catch(err){ $("emsg").textContent=err.message; } }
  else if(fm.id==="nform"){ const t=$("nt").value.trim(); if(!t) return; try{ await patch(CUR,{[BR[CUR.b].F.notes]:(CUR.notes?CUR.notes+"\n\n":"")+noteLine(t)}); openCase(CUR.id,true); }catch(err){ alertBox(err.message); } }
  else if(fm.id==="cform"){ const B=BR[NEW.b], d=Object.fromEntries(new FormData(fm)); const btn=fm.querySelector("button[type=submit]"); btn.disabled=true; $("cmsg").textContent="Saving…";
    try{ let custId=NEW.cust&&NEW.cust.id;
      if(!custId && !($("nstock")&&$("nstock").checked)){ const nf=$("nf").value.trim(), nl=$("nl").value.trim();
        if(!nf&&!nl) throw new Error("Pick a customer, add a new one, or tick Shop stock.");
        const cf={[U.first]:nf,[U.last]:nl}; if($("ne").value.trim()) cf[U.email]=$("ne").value.trim(); if($("np").value.trim()) cf[U.mobile]=$("np").value.trim();
        if($("na").value.trim()) cf[U.addr]=$("na").value.trim(); if($("nc").value.trim()) cf[U.city]=$("nc").value.trim(); if($("ns").value.trim()) cf[U.state]=$("ns").value.trim(); if($("nz").value.trim()) cf[U.zip]=$("nz").value.trim();
        const j=await at(UDB,"",{method:"POST",body:JSON.stringify({records:[{fields:cf}],typecast:true,returnFieldsByFieldId:true})}); custId=j.records[0].id; CUST[custId]=cu(j.records[0]); }
      const fields={[B.F.model]:d.model.trim(),[B.F.serial]:d.serial.trim(),[B.F.wo]:d.wo.replace(/[^0-9]/g,""),[B.F.status]:B.S.pending,[B.F.notes]:noteLine(d.issue.trim())};
      if(custId) fields[B.F.cust]=[custId]; if(d.tech) fields[B.F.tech]=[d.tech];
      const j=await at(B.table,"",{method:"POST",body:JSON.stringify({records:[{fields}],typecast:true,returnFieldsByFieldId:true})});
      const c=norm(NEW.b,j.records[0]); CASES.unshift(c); MAILKIND="request"; render(); openCase(c.id,true);
      setTimeout(()=>{ if($("mi")){ $("mi").value=d.issue.trim(); updMail(); } },0);
    }catch(err){ $("cmsg").textContent=err.message; btn.disabled=false; } }
});
function alertBox(m){ const n=document.createElement("div"); n.className="note warn"; n.textContent=m; $("detail").prepend(n); }
document.addEventListener("change",e=>{ if(e.target.classList&&e.target.classList.contains("fin")&&CUR&&e.target.files.length){ uploadFiles(CUR,[...e.target.files],e.target.dataset.k); e.target.value=""; } });
document.addEventListener("dragover",e=>{ const d=e.target.closest&&e.target.closest("[data-box]"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave",e=>{ const d=e.target.closest&&e.target.closest("[data-box]"); if(d) d.classList.remove("over"); });
document.addEventListener("drop",e=>{ const d=e.target.closest&&e.target.closest("[data-box]"); if(d&&CUR){ e.preventDefault(); d.classList.remove("over"); if(e.dataTransfer.files.length) uploadFiles(CUR,[...e.dataTransfer.files],d.dataset.box); } });
$("newbtn").onclick=openCreate;
$("who").innerHTML=`<option value="">Who's working?</option>`+STAFF.map(n=>`<option ${n===WHO?"selected":""}>${n}</option>`).join("");
$("who").onchange=e=>{ WHO=e.target.value; store.set("mrm-photos-who",WHO); if(CUR&&!$("detail").hidden) updMail(); };
function start(){ $("setup").hidden=!!TOKEN; if(!TOKEN){ show("none"); $("setup").hidden=false; return; } show("dash"); load(); }
start();
